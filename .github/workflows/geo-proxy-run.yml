name: Shared Proxy Run with Accurate Country

on:
  workflow_call:
    inputs:
      script:
        required: true
        type: string
      dependencies:
        required: false
        type: string
        default: "aiohttp aiohttp-socks"
      commit_message:
        required: false
        type: string
        default: "Update proxy lists [skip ci]"
      timeout_minutes:
        required: false
        type: number
        default: 120
    secrets:
      MAXMIND_ACCOUNT_ID:
        required: false
      MAXMIND_LICENSE_KEY:
        required: false
      IPINFO_TOKEN:
        required: false

permissions:
  contents: write

concurrency:
  group: proxy-v2-${{ github.repository }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: GeoLite cache key
        id: geo-date
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache GeoLite2 Country
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/GeoLite2-Country.mmdb
          key: geolite2-country-${{ runner.os }}-${{ steps.geo-date.outputs.week }}

      - name: Install dependencies
        run: pip install ${{ inputs.dependencies }} geoip2

      - name: Fetch shared v2 proxy engine
        run: |
          curl -fsSL https://raw.githubusercontent.com/asifshaikhtsn/Walla/main/geo_country.py -o geo_country.py
          curl -fsSL https://raw.githubusercontent.com/asifshaikhtsn/Walla/main/geo_runner.py -o geo_runner.py

      - name: Run proxy pool v2
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python geo_runner.py "${{ inputs.script }}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f geo_country.py geo_runner.py
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "${{ inputs.commit_message }}"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for i in {1..3}; do
            git pull --rebase --autostash origin "$BRANCH" && git push origin HEAD && exit 0
            echo "Push failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          echo "Push failed after 3 attempts"
          exit 1
