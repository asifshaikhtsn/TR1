name: Scrape & Filter Proxies

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run aggregator
        run: python scripts/proxy-aggregator.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || git pull --no-rebase origin main
          git add country/ last_run.json
          git diff --cached --quiet || git commit -m "Update proxy lists [skip ci]"
          git push